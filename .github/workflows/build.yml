name: Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build plugins
        run: |
          chmod +x gradlew
          ./gradlew clean make --stacktrace

      - name: Prepare build artifacts
        run: |
          rm -rf builds
          mkdir -p builds
          find . -type f \( -name "*.cs3" -o -name "plugins.json" \) -exec cp -f {} builds/ \;
          echo "Generated build artifacts:"
          find builds -maxdepth 2 -type f | sort

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: "builds/**"

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add builds/
          if git diff --cached --quiet; then
            echo "No build artifacts to commit."
          else
            git commit -m "Update builds"
            git push origin HEAD:builds --force
          fi
        continue_on_error: true
